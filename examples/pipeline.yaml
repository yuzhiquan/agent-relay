# Example: plan -> review plan -> implement, with one human gate before commit.
#
# Run it:
#   agent-relay run "Add a --json flag to the CLI" -p examples/pipeline.yaml
#
# Files are the hand-off medium between agents: each step's `output` becomes the
# next step's `inputs`. Swap any `agent:` for codex/claude/gemini/aider/generic.

name: plan-review-implement
workspace: .
work_dir: .agent-relay

steps:
  - name: plan
    agent: claude
    role: plan
    prompt_file: prompts/plan.md
    output: PLAN.md

  - name: review-plan
    agent: codex
    role: review
    prompt_file: prompts/review.md
    inputs: [PLAN.md]
    output: .agent-relay/plan-review.md

  - name: implement
    agent: codex
    role: implement
    prompt_file: prompts/implement.md
    inputs: [PLAN.md, .agent-relay/plan-review.md]
    # The single human gate — review the diff before you commit anything.
    approve_after: true

  # Example of the zero-code generic adapter wrapping an arbitrary CLI:
  # - name: lint
  #   agent: generic
  #   command: ["my-linter", "--fix", "--prompt", "{prompt}", "--out", "{output}"]
  #   output: .agent-relay/lint.log
