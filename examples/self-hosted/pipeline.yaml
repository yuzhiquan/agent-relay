# Self-hosted example: agent-relay improving ITSELF, with a review LOOP.
#
# This pipeline points at the agent-relay repo, reads the project's own PLAN.md,
# then loops plan->review up to a cap: the reviewer ends its output with a
# verdict marker, and the loop re-runs (feeding the review back into the next
# plan) until APPROVED or max_iterations is reached. Then it implements, with
# one human gate before you commit.
#
# Run from the repo root:
#   agent-relay run -p examples/self-hosted/pipeline.yaml --dry-run
#   agent-relay run -p examples/self-hosted/pipeline.yaml

name: agent-relay-self-improve
workspace: .                       # the agent-relay repo itself
work_dir: .agent-relay

steps:
  # 1) Draft / revise the build spec. On the first pass review.md won't exist
  #    (treated as empty); on later passes it carries the reviewer's feedback.
  - name: plan
    agent: codex
    role: plan
    prompt_file: prompts/plan.md
    inputs: [PLAN.md, .agent-relay/review.md]
    output: .agent-relay/init-spec.md

  # 2) Review the spec and emit a verdict the loop can read.
  - name: review
    agent: codex
    role: review
    prompt_file: prompts/review.md
    inputs: [.agent-relay/init-spec.md]
    output: .agent-relay/review.md

  # 3) Implement the approved spec. Single human gate before commit.
  - name: implement
    agent: codex
    role: implement
    prompt_file: prompts/implement.md
    inputs: [PLAN.md, .agent-relay/init-spec.md, .agent-relay/review.md]
    approve_after: true

loops:
  # Repeat plan->review until the review approves, capped at 3 rounds.
  - name: plan-review
    steps: [plan, review]
    until_step: review
    max_iterations: 3
    approved_marker: "VERDICT: APPROVED"
